<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45">
  <!-- Crown portrait frame (white) with circular face window -->
  <path fill-rule="evenodd" fill="#f5e6c8" stroke="#c9a84c" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"
    d="M 9,19 L 9,12 L 14,17 L 18,9 L 22.5,14 L 27,9 L 31,17 L 36,12 L 36,19
       Q 40,30 38,42 L 7,42 Q 5,30 9,19 Z
       M 31.5,28 A 9,9 0 1,1 13.5,28 A 9,9 0 1,1 31.5,28 Z"/>
  <!-- Crown cross -->
  <line x1="22.5" y1="14" x2="22.5" y2="3" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="8" x2="26" y2="8" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crown gem points -->
  <circle fill="#c9a84c" cx="9" cy="12" r="1.2"/>
  <circle fill="#c9a84c" cx="36" cy="12" r="1.2"/>
  <circle fill="#c9a84c" cx="18" cy="9" r="1.2"/>
  <circle fill="#c9a84c" cx="27" cy="9" r="1.2"/>
  <!-- Face window decorative ring -->
  <circle cx="22.5" cy="28" r="9" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
  <!-- Collar decoration -->
  <path d="M 11,40 Q 22.5,39 34,40" stroke="#c9a84c" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>
