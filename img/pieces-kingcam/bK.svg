<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45">
  <!-- Crown portrait frame (black) with large circular face window -->
  <path fill-rule="evenodd" fill="#3a3530" stroke="#b8945a" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"
    d="M 7,20 L 7,12 L 12,17 L 16,8 L 22.5,13 L 29,8 L 33,17 L 38,12 L 38,20
       Q 42,31 39,43 L 6,43 Q 3,31 7,20 Z
       M 34.5,27 A 12,12 0 1,1 10.5,27 A 12,12 0 1,1 34.5,27 Z"/>
  <!-- Crown cross -->
  <line x1="22.5" y1="13" x2="22.5" y2="2" stroke="#b8945a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="7" x2="28" y2="7" stroke="#b8945a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crown gem points -->
  <circle fill="#b8945a" cx="7" cy="12" r="1.2"/>
  <circle fill="#b8945a" cx="38" cy="12" r="1.2"/>
  <circle fill="#b8945a" cx="16" cy="8" r="1.2"/>
  <circle fill="#b8945a" cx="29" cy="8" r="1.2"/>
  <!-- Face window decorative ring -->
  <circle cx="22.5" cy="27" r="12" fill="none" stroke="#b8945a" stroke-width="0.8" opacity="0.4"/>
  <!-- Collar decoration -->
  <path d="M 9,41 Q 22.5,40 36,41" stroke="#b8945a" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>
